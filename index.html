<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyetRadio - Masterpiece Edition</title>
    <style>
        /* Gaya dasar tetep ikutin tema dark lu */
        body { background-color: #0d1117; color: white; font-family: sans-serif; text-align: center; }
        
        /* Style Banner Iklan NyetStudio */
        .nyet-ad-container {
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid #30363d;
            border-bottom: 1px solid #30363d;
            margin: 20px 0;
            padding: 10px 0;
            overflow: hidden;
        }
        
        .nyet-ad-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #58a6ff; /* Warna biru khas coding */
        }

        .highlight {
            color: #ff7b72; /* Warna merah aksen */
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <img src="cover.jpg" id="album-art" style="width: 200px; border-radius: 15px; box-shadow: 0 0 20px rgba(88, 166, 255, 0.5);">
        <h2 id="radio-name">NYETRADIO</h2>
        <div id="metadata-container">
            <p id="track-info">🎵 <span id="current-track">Loading...</span></p>
        </div>
    </div>

    <div class="nyet-ad-container">
        <marquee class="nyet-ad-text" behavior="scroll" direction="left" scrollamount="6">
            🚀 <span class="highlight">AD:</span> NyetStudio — "Ubah ide menjadi masterpiece" 🔥 
            | Jasa Coding, Desain, & Troubleshooting Android Pro 
            | Hubungi: <a href="https://nyetstudio.gt.tc/" style="color: #d2a8ff; text-decoration: none;">nyetstudio.gt.tc</a> ⚡
        </marquee>
    </div>

    <div id="chat-container">
        <div id="chat-messages" style="height: 300px; overflow-y: auto; text-align: left; padding: 10px;">
            </div>
    </div>

    <script>
        // ... Logic Firebase update_metadata lu ...
    </script>
</body>
</html>
