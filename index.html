<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyetRadio | Live Streaming</title>
  <style>
    body { background: #020617; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; background: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 0 50px rgba(59, 130, 246, 0.2); border: 1px solid #334155; }
    
    /* Header & Stats */
    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    #statusIndicator { padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .on-air { background: #ef4444; box-shadow: 0 0 15px #ef4444; animation: blink 1s infinite; }
    .off-air { background: #475569; }
    #listenerCount { font-size: 12px; color: #94a3b8; font-weight: bold; }

    /* Player Box */
    .player-box { margin-bottom: 25px; padding: 30px 20px; border: 2px solid #3b82f6; border-radius: 15px; background: #111827; }
    #nowPlaying { color: #60a5fa; font-weight: bold; margin-bottom: 15px; min-height: 24px; text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); }

    /* Visualizer CSS (Safe Mode) */
    .visualizer-container { display: flex; justify-content: center; align-items: flex-end; height: 35px; gap: 4px; margin-top: 20px; }
    .bar { width: 5px; background: #3b82f6; border-radius: 3px; display: none; animation: bounce 0.5s ease-in-out infinite alternate; }
    @keyframes bounce { from { height: 4px; } to { height: 30px; } }
    .bar:nth-child(2) { animation-duration: 0.4s; } .bar:nth-child(3) { animation-duration: 0.6s; }
    .bar:nth-child(4) { animation-duration: 0.3s; } .bar:nth-child(5) { animation-duration: 0.7s; }
    .bar:nth-child(6) { animation-duration: 0.5s; }

    /* Chat Box */
    #chatBox { height: 200px; overflow-y: auto; background: #0f172a; text-align: left; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; font-size: 14px; }
    .chat-msg { margin-bottom: 8px; }
    #chatInput { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; box-sizing: border-box; background: #1e293b; color: white; outline: none; }
    .btn-talk { background: #5865F2; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; font-size: 14px; text-decoration: none; display: block; }

    /* Modal */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
    .modal-content { background: #1e293b; margin: 30% auto; padding: 25px; border: 1px solid #3b82f6; width: 80%; max-width: 320px; border-radius: 20px; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; color: #64748b; font-size: 24px; cursor: pointer; }

    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <div class="stats-bar">
    <div id="statusIndicator" class="off-air">OFF AIR</div>
    <div id="listenerCount">👥 0 Mendengarkan</div>
  </div>

  <h1>🎧 NyetRadio</h1>

  <div class="player-box">
    <div id="nowPlaying">📡 Menunggu siaran...</div>
    <audio id="audioPlayer" controls preload="metadata" style="width: 100%;">
      <source src="https://concerns-medicaid-deposits-ion.trycloudflare.com/live" type="audio/mpeg">
    </audio>
    
    <div class="visualizer-container" id="visualizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div id="chatBox"></div>
  <input type="text" id="chatInput" placeholder="Ketik pesan lalu Enter...">

  <button class="btn-talk" onclick="openModal()">🎙 Join Discord Talk</button>
</div>

<div id="discordModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h3 style="margin-top:0">Join Community</h3>
    <p style="font-size: 13px; color: #94a3b8;">Gabung ke obrolan NyetRadio di Discord.</p>
    <a href="https://discord.gg/68hDfgpsFb" target="_blank" class="btn-talk">Masuk Sekarang</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // CONFIG FIREBASE (Sesuai milik lu)
  const firebaseConfig = {
    apiKey: "AIzaSyDV5K8-zseYUbtzK7QJAkyN-UnILiSFOkg",
    authDomain: "live-chat-nyet.firebaseapp.com",
    databaseURL: "https://live-chat-nyet-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "live-chat-nyet",
    storageBucket: "live-chat-nyet.firebasestorage.app",
    messagingSenderId: "112945135453",
    appId: "1:112945135453:web:983ed80516e971091ef2b4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 1. Logika Pendengar Real-time
  const myPresenceRef = db.ref("presence").push();
  db.ref(".info/connected").on("value", (snap) => {
    if (snap.val()) { myPresenceRef.onDisconnect().remove(); myPresenceRef.set(true); }
  });
  db.ref("presence").on("value", (snap) => {
    document.getElementById("listenerCount").innerText = `👥 ${snap.numChildren()} Mendengarkan`;
  });

  // 2. Logika Status & Metadata
  db.ref("status/live").on("value", (snap) => {
    const isLive = snap.val();
    const ind = document.getElementById("statusIndicator");
    ind.innerText = isLive ? "ON AIR" : "OFF AIR";
    ind.className = isLive ? "on-air" : "off-air";
  });

  db.ref("nowPlaying").on("value", (snap) => {
    const song = snap.val();
    document.getElementById("nowPlaying").innerHTML = (song && song.title !== 'Offline') ? `🎵 ${song.title} - ${song.artist}` : "📡 Station Offline";
  });

  // 3. Logika Visualizer & Audio Control
  const audio = document.getElementById('audioPlayer');
  const bars = document.querySelectorAll('.bar');

  audio.onplay = () => { bars.forEach(b => b.style.display = 'block'); };
  audio.onpause = () => { bars.forEach(b => b.style.display = 'none'); };

  // 4. Chat System
  const chatInput = document.getElementById("chatInput");
  const chatBox = document.getElementById("chatBox");

  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && chatInput.value.trim() !== "") {
      let nama = localStorage.getItem("nama") || "User-" + Math.floor(Math.random() * 1000);
      db.ref("chat").push({ user: nama, text: chatInput.value });
      chatInput.value = "";
    }
  });

  db.ref("chat").limitToLast(15).on("child_added", (snap) => {
    const msg = snap.val();
    const div = document.createElement("div");
    div.className = "chat-msg";
    div.innerHTML = `<b style="color:#60a5fa">${msg.user || 'Anonim'}:</b> ${msg.text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  // 5. Modal & Nickname
  const modal = document.getElementById("discordModal");
  function openModal() { modal.style.display = "block"; }
  function closeModal() { modal.style.display = "none"; }
  window.onclick = (e) => { if(e.target == modal) closeModal(); }

  if (!localStorage.getItem("nama")) {
    const p = prompt("Masukkan Nickname lu:");
    if (p) localStorage.setItem("nama", p);
  }
</script>
</body>
</html>
