<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyetRadio</title>
  <link rel="icon" type="image/png" href="https://files.catbox.moe/rse57p.png">

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --neon-yellow: #facc15;
      --neon-pink: #ff00ff;
      --dark-navy: #020617;
      --card-bg: rgba(30, 41, 59, 0.9);
    }

    /* EFEK CRT GLOBAL */
    .crt-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 100%),
                  rgba(18, 16, 16, 0.1);
      opacity: 0.15; pointer-events: none; z-index: 999;
    }

    .scanlines {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none; z-index: 1000;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.1; }
      50% { opacity: 0.13; }
      100% { opacity: 0.1; }
    }

    body { 
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
      color: white; 
      font-family: 'Inter', 'Segoe UI', sans-serif; 
      text-align: center; 
      margin: 0; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* LOADING SCREEN */
    #loadingScreen {
      position: fixed; inset: 0; background: var(--dark-navy); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .loader-logo { width: 120px; animation: pulse-neon 2s infinite; }
    .loader-bar { width: 150px; height: 4px; background: #1e293b; margin-top: 20px; border-radius: 10px; overflow: hidden; }
    .loader-progress { width: 0%; height: 100%; background: var(--neon-cyan); animation: load 1.5s forwards; }
    @keyframes load { to { width: 100%; } }
    @keyframes pulse-neon {
      0%, 100% { filter: drop-shadow(0 0 5px var(--neon-cyan)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px var(--neon-cyan)); transform: scale(1.05); }
    }

    /* MAIN CONTAINER */
    .container { 
      max-width: 450px; width: 90%;
      background: var(--card-bg); padding: 30px; border-radius: 30px; 
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
      border: 1px solid rgba(255,255,255,0.1);
      animation: slideUp 0.8s ease-out;
      position: relative; z-index: 10;
      margin: 20px 0;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* CIRCULAR VIZ WRAPPER */
    .art-stack {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #circularViz {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.5s ease;
      filter: blur(0.4px) contrast(1.2) brightness(1.2); /* Retro Filter */
    }

    /* LOGO & ARTWORK WITH FADE EFFECT */
    .logo-main { 
      width: 150px; height: 150px; border-radius: 50%; object-fit: cover; 
      filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.4)); 
      transition: opacity 0.8s ease-in-out, transform 0.4s;
      position: relative; z-index: 2;
    }
    .logo-main:hover { transform: scale(1.05); }

    .radio-title { color: var(--neon-yellow); font-size: 28px; font-weight: 900; text-transform: uppercase; margin: 10px 0; text-shadow: 3px 3px 0px #000; }
    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    #statusIndicator { padding: 5px 15px; border-radius: 50px; font-size: 10px; font-weight: 800; }
    .on-air { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); animation: blink 1.5s infinite; }
    .off-air { background: #475569; }

    /* VISUALIZER SCREEN */
    #vizWallpaper {
      width: 100%; height: 120px; background: #000; border-radius: 20px; 
      margin: 15px 0; overflow: hidden; display: none; border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); position: relative; cursor: pointer;
    }
    .viz-mode { position: absolute; inset: 0; display: none; }
    .viz-mode.active { display: block; }
    .plasma-bg { background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: gradientBG 3s ease infinite; opacity: 0.8; height: 100%; }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .grid-bg { background: #000; perspective: 200px; height: 100%; overflow: hidden; }
    .grid-lines { position: absolute; width: 200%; height: 200%; left: -50%; top: -50%; background-image: linear-gradient(rgba(0, 242, 255, 0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.5) 1px, transparent 1px); background-size: 40px 40px; transform: rotateX(60deg); animation: gridMove 1s linear infinite; }
    @keyframes gridMove { 0% { transform: rotateX(60deg) translateY(0); } 100% { transform: rotateX(60deg) translateY(40px); } }
    .spectrum-bg { display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 100%; padding-bottom: 10px; box-sizing: border-box; background: #000; }
    .big-bar { width: 12px; background: linear-gradient(to top, var(--neon-cyan), var(--neon-pink)); animation: bounce 0.5s infinite alternate; border-radius: 3px; }
    @keyframes bounce { 0% { height: 10%; } 100% { height: 90%; } }

    /* PLAYER BOX */
    .player-box { margin-bottom: 25px; padding: 25px; border-radius: 20px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(59, 130, 246, 0.3); }
    #nowPlaying { color: var(--neon-cyan); font-weight: bold; font-size: 14px; margin-bottom: 15px; height: 20px; }
    .visualizer-container { display: flex; justify-content: center; align-items: flex-end; height: 45px; gap: 3px; margin-top: 10px; }
    .bar { width: 8px; background: var(--neon-cyan); border-radius: 2px 2px 0 0; transition: height 0.1s ease; min-height: 3px; }

    /* AD BANNER */
    .ad-banner { 
      background: rgba(0, 0, 0, 0.5); color: #fff; padding: 8px 0; margin: 15px 0; border-radius: 8px; 
      border: 1px solid var(--neon-cyan); 
      font-family: 'Courier New', Courier, monospace; font-size: 0.9em; cursor: pointer;
      text-shadow: 0 0 8px rgba(0, 242, 255, 0.8);
    }
    .ad-banner a { color: inherit; text-decoration: none; display: block; }

    /* CHAT BOX */
    #chatBox { height: 180px; background: rgba(15, 23, 42, 0.6); text-align: left; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); font-size: 13px; overflow-y: auto; }
    #chatInput { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; box-sizing: border-box; }
    #chatInput:focus { border-color: var(--neon-cyan); }

    /* BUTTONS */
    .btn-talk, .btn-share { color: #000; border: none; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 800; margin-top: 10px; text-transform: uppercase; transition: 0.3s; text-decoration: none; display: block; font-family: 'Inter', sans-serif; }
    .btn-talk { background: linear-gradient(135deg, var(--neon-cyan) 0%, #0066ff 100%); }
    .btn-share { background: linear-gradient(135deg, var(--neon-pink) 0%, #7000ff 100%); color: #fff; }
    .btn-talk:hover, .btn-share:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3); }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .chat-msg { margin-bottom: 8px; animation: fadeIn 0.3s ease; }
    .tap-hint { position: absolute; bottom: 5px; right: 10px; font-size: 9px; color: rgba(255,255,255,0.5); z-index: 20; }
  </style>
</head>
<body>

<div class="crt-overlay"></div>
<div class="scanlines"></div>

<div id="loadingScreen">
  <img src="https://files.catbox.moe/rse57p.png" class="loader-logo">
  <div class="loader-bar"><div class="loader-progress"></div></div>
</div>

<div class="container">
  <div class="stats-bar">
    <div id="statusIndicator" class="off-air">OFF AIR</div>
    <div id="listenerCount">👥 0 LISTENING</div>
  </div>

  <div class="art-stack">
    <canvas id="circularViz" width="520" height="520"></canvas>
    <img src="https://files.catbox.moe/rse57p.png" id="albumArt" alt="Logo" class="logo-main">
  </div>

  <h1 class="radio-title">NyetRadio</h1>

  <div id="vizWallpaper">
    <div class="tap-hint">TAP TO CHANGE EFFECT</div>
    <div class="viz-mode" id="viz-plasma"><div class="plasma-bg"></div></div>
    <div class="viz-mode" id="viz-grid"><div class="grid-bg"><div class="grid-lines"></div></div></div>
    <div class="viz-mode" id="viz-spectrum"><div class="spectrum-bg"></div></div>
  </div>

  <div class="player-box">
    <div id="nowPlaying">📡 Awaiting Signal...</div>
    <audio id="audioPlayer" controls style="width: 100%; filter: invert(100%) brightness(1.5);">
      <source src="https://maybe-losing-secretary-skin.trycloudflare.com/live" type="audio/mpeg">
    </audio>
    <div class="visualizer-container" id="visualizer"></div>
  </div>

  <div class="ad-banner">
    <a href="https://nyetstudio.gt.tc/" target="_blank">
      <marquee behavior="scroll" direction="left">
          🚀 <span style="color: #ffcc00; font-weight: bold;">AD:</span> 
          NyetStudio - Ubah ide menjadi masterpiece! 🔥 
          Cek di: <span style="text-decoration: underline;">nyetstudio.gt.tc</span> 
      </marquee>
    </a>
  </div>

  <div id="chatBox"></div>
  <input type="text" id="chatInput" placeholder="Ketik pesan lalu Enter...">

  <button class="btn-talk" onclick="window.open('https://discord.gg/68hDfgpsFb', '_blank')">🎙 Join Discord</button>
  <button class="btn-share" id="shareBtn">📤 Share Story</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loadingScreen').style.opacity = '0';
      setTimeout(() => document.getElementById('loadingScreen').style.visibility = 'hidden', 800);
    }, 1500);
  });

  const firebaseConfig = {
    apiKey: "AIzaSyDV5K8-zseYUbtzK7QJAkyN-UnILiSFOkg",
    authDomain: "live-chat-nyet.firebaseapp.com",
    databaseURL: "https://live-chat-nyet-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "live-chat-nyet",
    storageBucket: "live-chat-nyet.firebasestorage.app",
    messagingSenderId: "112945135453",
    appId: "1:112945135453:web:983ed80516e971091ef2b4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // --- LOGIC CIRCULAR VISUALIZER (RETRO STYLE) ---
  const circCanvas = document.getElementById('circularViz');
  const circCtx = circCanvas.getContext('2d');
  let circAnimId;

  function drawCircular() {
    circAnimId = requestAnimationFrame(drawCircular);
    circCtx.clearRect(0, 0, circCanvas.width, circCanvas.height);

    const centerX = circCanvas.width / 2;
    const centerY = circCanvas.height / 2;
    const radius = 105;
    const bars = 70;

    for (let i = 0; i < bars; i++) {
      const slow = Math.sin(Date.now() / 400 + i * 0.15) * 12;
      const pulse = Math.random() * 35;
      const barHeight = 8 + slow + pulse;
      const angle = (i * Math.PI * 2) / bars;

      const x1 = centerX + Math.cos(angle) * radius;
      const y1 = centerY + Math.sin(angle) * radius;
      const x2 = centerX + Math.cos(angle) * (radius + barHeight);
      const y2 = centerY + Math.sin(angle) * (radius + barHeight);

      // RETRO COLOR JUMPER
      const r = i % 2 === 0 ? 0 : 255;
      const g = i % 2 === 0 ? 242 : 0;
      const b = i % 2 === 0 ? 255 : 255;
      
      circCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.7 + Math.random() * 0.3})`;
      circCtx.lineWidth = 4;
      circCtx.lineCap = 'round';
      circCtx.shadowBlur = 12;
      circCtx.shadowColor = circCtx.strokeStyle;

      circCtx.beginPath();
      circCtx.moveTo(x1, y1);
      circCtx.lineTo(x2, y2);
      circCtx.stroke();
    }
  }

  async function updateArtwork(title, artist) {
    const artEl = document.getElementById('albumArt');
    try {
      const query = encodeURIComponent(`${title} ${artist}`);
      const res = await fetch(`https://itunes.apple.com/search?term=${query}&limit=1&entity=song`);
      const data = await res.json();
      if (data.results.length > 0) {
        artEl.style.opacity = '0';
        setTimeout(() => {
          const imgUrl = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
          artEl.src = imgUrl;
          artEl.style.opacity = '1';
        }, 800);
      } else {
        artEl.src = "https://files.catbox.moe/rse57p.png";
        artEl.style.opacity = '1';
      }
    } catch (e) { artEl.src = "https://files.catbox.moe/rse57p.png"; artEl.style.opacity = '1'; }
  }

  const myPresenceRef = db.ref("presence").push();
  db.ref(".info/connected").on("value", (snap) => {
    if (snap.val()) { myPresenceRef.onDisconnect().remove(); myPresenceRef.set(true); }
  });
  db.ref("presence").on("value", (snap) => {
    document.getElementById("listenerCount").innerText = `👥 ${snap.numChildren()} LISTENING`;
  });
  db.ref("status/live").on("value", (snap) => {
    const isLive = snap.val();
    const ind = document.getElementById("statusIndicator");
    ind.innerText = isLive ? "ON AIR" : "OFF AIR";
    ind.className = isLive ? "on-air" : "off-air";
  });
  db.ref("nowPlaying").on("value", (snap) => {
    const song = snap.val();
    const nowPlayingEl = document.getElementById("nowPlaying");
    if (song && song.title && song.title !== 'Offline' && song.title !== 'undefined') {
      nowPlayingEl.innerHTML = `🎵 ${song.title} - ${song.artist}`;
      updateArtwork(song.title, song.artist);
    } else {
      nowPlayingEl.innerHTML = "📡 Station Offline";
      document.getElementById('albumArt').src = "https://files.catbox.moe/rse57p.png";
    }
  });

  const audio = document.getElementById('audioPlayer');
  const vizWallpaper = document.getElementById('vizWallpaper');
  const miniVizContainer = document.getElementById('visualizer');
  for (let i = 0; i < 16; i++) {
    const bar = document.createElement('div'); bar.className = 'bar'; miniVizContainer.appendChild(bar);
  }
  const miniBars = document.querySelectorAll('.bar');
  const spectrumBg = document.querySelector('.spectrum-bg');
  for (let i = 0; i < 10; i++) {
    const bigBar = document.createElement('div'); bigBar.className = 'big-bar'; bigBar.style.animationDuration = (0.3 + Math.random() * 0.5) + 's'; spectrumBg.appendChild(bigBar);
  }
  const vizModes = ['viz-plasma', 'viz-grid', 'viz-spectrum'];
  let currentModeIndex = 0;
  let vizInterval;

  function changeVisualizer() {
    document.querySelectorAll('.viz-mode').forEach(el => el.classList.remove('active'));
    currentModeIndex = (currentModeIndex + 1) % vizModes.length;
    document.getElementById(vizModes[currentModeIndex]).classList.add('active');
  }
  vizWallpaper.addEventListener('click', changeVisualizer);

  audio.onplay = () => {
    circCanvas.style.opacity = '1';
    drawCircular();
    vizWallpaper.style.display = 'block';
    currentModeIndex = Math.floor(Math.random() * vizModes.length);
    document.getElementById(vizModes[currentModeIndex]).classList.add('active');
    vizInterval = setInterval(() => {
      miniBars.forEach(bar => {
        const h = Math.random() * 45 + 5; 
        bar.style.height = h + 'px';
        bar.style.backgroundColor = h > 35 ? 'var(--neon-yellow)' : 'var(--neon-cyan)';
      });
    }, 100);
  };

  audio.onpause = () => {
    circCanvas.style.opacity = '0';
    cancelAnimationFrame(circAnimId);
    vizWallpaper.style.display = 'none'; 
    clearInterval(vizInterval);
    miniBars.forEach(bar => { bar.style.height = '4px'; bar.style.backgroundColor = 'var(--neon-cyan)'; });
  };

  const chatInput = document.getElementById("chatInput");
  const chatBox = document.getElementById("chatBox");
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && chatInput.value.trim() !== "") {
      let nama = localStorage.getItem("nama") || "Gorilla-" + Math.floor(Math.random() * 99);
      db.ref("chat").push({ user: nama, text: chatInput.value });
      chatInput.value = "";
    }
  });
  db.ref("chat").limitToLast(15).on("child_added", (snap) => {
    const msg = snap.val();
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement("div"); div.className = "chat-msg";
    div.innerHTML = `<small style="opacity:0.4; font-size:10px;">${time}</small> <b style="color:var(--neon-cyan)">${msg.user}:</b> ${msg.text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    const track = document.getElementById('nowPlaying').innerText;
    const shareText = `Lagi dengerin ${track} di NyetRadio! 🔥\n\nKuy dengerin bareng di sini:\nhttps://herblow.github.io/NyetRadio/`;
    if (navigator.share) {
      navigator.share({ title: 'NyetRadio', text: shareText, url: 'https://herblow.github.io/NyetRadio/' }).catch(err => console.log('Batal Share'));
    } else {
      const el = document.createElement('textarea'); el.value = shareText; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
      alert('Teks share berhasil di-copy! Paste di Story lu nyet! 🔥');
    }
  });

  if (!localStorage.getItem("nama")) {
    const p = prompt("Nama lu siapa nyet?"); if (p) localStorage.setItem("nama", p);
  }
</script>
</body>
</html>
