<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyetRadio</title>
  <link rel="icon" type="image/png" href="https://files.catbox.moe/rse57p.png">

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --neon-yellow: #facc15;
      --dark-navy: #020617;
      --card-bg: rgba(30, 41, 59, 0.85);
    }

    body { 
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
      color: white; 
      font-family: 'Inter', 'Segoe UI', sans-serif; 
      text-align: center; 
      margin: 0; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* LOADING SCREEN */
    #loadingScreen {
      position: fixed; inset: 0; background: var(--dark-navy); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .loader-logo { width: 120px; animation: pulse-neon 2s infinite; }
    .loader-bar { width: 150px; height: 4px; background: #1e293b; margin-top: 20px; border-radius: 10px; overflow: hidden; }
    .loader-progress { width: 0%; height: 100%; background: var(--neon-cyan); animation: load 1.5s forwards; }
    @keyframes load { to { width: 100%; } }
    @keyframes pulse-neon {
      0%, 100% { filter: drop-shadow(0 0 5px var(--neon-cyan)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px var(--neon-cyan)); transform: scale(1.05); }
    }

    /* MAIN CONTAINER */
    .container { 
      max-width: 450px; width: 90%;
      background: var(--card-bg); padding: 30px; border-radius: 30px; 
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
      border: 1px solid rgba(255,255,255,0.1);
      animation: slideUp 0.8s ease-out;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* LOGO & STATS */
    .logo-main { width: 160px; height: auto; filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.4)); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-bottom: -10px; }
    .logo-main:hover { transform: scale(1.1) rotate(-3deg); }
    .radio-title { color: var(--neon-yellow); font-size: 28px; font-weight: 900; text-transform: uppercase; margin: 10px 0; text-shadow: 3px 3px 0px #000; }
    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    #statusIndicator { padding: 5px 15px; border-radius: 50px; font-size: 10px; font-weight: 800; }
    .on-air { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); animation: blink 1.5s infinite; }
    .off-air { background: #475569; }

    /* VISUALIZATION WALLPAPER (WINAMP STYLE) */
    #vizWallpaper {
      width: 100%; height: 160px; background: #000; border-radius: 20px; 
      margin: 15px 0; overflow: hidden; display: none; border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); position: relative;
    }
    #bgVideo { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

    /* PLAYER BOX */
    .player-box { margin-bottom: 25px; padding: 25px; border-radius: 20px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(59, 130, 246, 0.3); }
    #nowPlaying { color: var(--neon-cyan); font-weight: bold; font-size: 14px; margin-bottom: 15px; height: 20px; }

    .visualizer-container { 
      display: flex; justify-content: center; align-items: flex-end; 
      height: 45px; gap: 3px; margin-top: 10px; 
    }
    .bar { 
      width: 8px; background: var(--neon-cyan); 
      border-radius: 2px 2px 0 0;
      transition: height 0.1s ease;
      min-height: 3px;
    }

    /* CHAT BOX */
    #chatBox { 
      height: 180px; background: rgba(15, 23, 42, 0.6); text-align: left; padding: 15px; border-radius: 15px; 
      margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); font-size: 13px; overflow-y: auto;
    }
    #chatInput { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; box-sizing: border-box; }
    #chatInput:focus { border-color: var(--neon-cyan); }

    /* BUTTONS */
    .btn-talk { 
      background: linear-gradient(135deg, var(--neon-cyan) 0%, #0066ff 100%); 
      color: #000; border: none; padding: 14px; border-radius: 12px; 
      cursor: pointer; width: 100%; font-weight: 800; margin-top: 10px; 
      text-transform: uppercase; transition: 0.3s; text-decoration: none; display: block;
    }
    .btn-talk:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3); }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .chat-msg { margin-bottom: 8px; animation: fadeIn 0.3s ease; }
  </style>
</head>
<body>

<div id="loadingScreen">
  <img src="https://files.catbox.moe/rse57p.png" class="loader-logo">
  <div class="loader-bar"><div class="loader-progress"></div></div>
</div>

<div class="container">
  <div class="stats-bar">
    <div id="statusIndicator" class="off-air">OFF AIR</div>
    <div id="listenerCount">👥 0 LISTENING</div>
  </div>

  <img src="https://files.catbox.moe/rse57p.png" alt="Logo" class="logo-main">
  <h1 class="radio-title">NyetRadio</h1>

  <div id="vizWallpaper">
    <video id="bgVideo" loop muted playsinline>
      <source src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXZueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKMGpxxS0u787YI/giphy.mp4" type="video/mp4">
    </video>
  </div>

  <div class="player-box">
    <div id="nowPlaying">📡 Awaiting Signal...</div>
    <audio id="audioPlayer" controls style="width: 100%; filter: invert(100%) brightness(1.5);">
      <source src="https://canberra-guests-composer-aqua.trycloudflare.com/live" type="audio/mpeg">
    </audio>

    <div class="visualizer-container" id="visualizer">
      </div>
  </div>

  <div id="chatBox"></div>
  <input type="text" id="chatInput" placeholder="Ketik pesan lalu Enter...">
  <button class="btn-talk" onclick="window.open('https://discord.gg/68hDfgpsFb', '_blank')">🎙 Join Discord</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loadingScreen').style.opacity = '0';
      setTimeout(() => document.getElementById('loadingScreen').style.visibility = 'hidden', 800);
    }, 1500);
  });

  const firebaseConfig = {
    apiKey: "AIzaSyDV5K8-zseYUbtzK7QJAkyN-UnILiSFOkg",
    authDomain: "live-chat-nyet.firebaseapp.com",
    databaseURL: "https://live-chat-nyet-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "live-chat-nyet",
    storageBucket: "live-chat-nyet.firebasestorage.app",
    messagingSenderId: "112945135453",
    appId: "1:112945135453:web:983ed80516e971091ef2b4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Presence
  const myPresenceRef = db.ref("presence").push();
  db.ref(".info/connected").on("value", (snap) => {
    if (snap.val()) { myPresenceRef.onDisconnect().remove(); myPresenceRef.set(true); }
  });
  db.ref("presence").on("value", (snap) => {
    document.getElementById("listenerCount").innerText = `👥 ${snap.numChildren()} LISTENING`;
  });

  // Metadata
  db.ref("status/live").on("value", (snap) => {
    const isLive = snap.val();
    const ind = document.getElementById("statusIndicator");
    ind.innerText = isLive ? "ON AIR" : "OFF AIR";
    ind.className = isLive ? "on-air" : "off-air";
  });
  db.ref("nowPlaying").on("value", (snap) => {
    const song = snap.val();
    document.getElementById("nowPlaying").innerHTML = (song && song.title !== 'Offline') ? `🎵 ${song.title} - ${song.artist}` : "📡 Station Offline";
  });

  // --- WINAMP VISUALIZER ENGINE (HYBRID MODE) ---
  const audio = document.getElementById('audioPlayer');
  const vizContainer = document.getElementById('visualizer');
  const vizWallpaper = document.getElementById('vizWallpaper');
  const bgVideo = document.getElementById('bgVideo');
  
  // Generate Bars
  const numberOfBars = 16;
  for (let i = 0; i < numberOfBars; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    vizContainer.appendChild(bar);
  }
  const bars = document.querySelectorAll('.bar');

  // Logic Visualizer yang Aman (Anti Macet)
  let vizInterval;
  
  audio.onplay = () => {
    // 1. Munculin Video Visualizer
    vizWallpaper.style.display = 'block';
    bgVideo.play();

    // 2. Jalankan Bar Visualizer (Simulasi Beat)
    // Kita pakai simulasi karena Cloudflare sering blokir akses data audio asli (CORS)
    vizInterval = setInterval(() => {
      bars.forEach(bar => {
        // Tinggi bar acak biar kelihatan kayak ngikutin lagu
        const h = Math.random() * 45 + 5; 
        bar.style.height = h + 'px';
        
        // Warna berubah kalo tinggi banget (efek bass)
        if (h > 35) {
          bar.style.backgroundColor = 'var(--neon-yellow)';
        } else {
          bar.style.backgroundColor = 'var(--neon-cyan)';
        }
      });
    }, 100); // Update setiap 100ms
  };

  audio.onpause = () => {
    bgVideo.pause();
    vizWallpaper.style.display = 'none';
    clearInterval(vizInterval);
    // Reset bar jadi pendek
    bars.forEach(bar => {
      bar.style.height = '4px';
      bar.style.backgroundColor = 'var(--neon-cyan)';
    });
  };

  // Chat System
  const chatInput = document.getElementById("chatInput");
  const chatBox = document.getElementById("chatBox");
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && chatInput.value.trim() !== "") {
      let nama = localStorage.getItem("nama") || "Gorilla-" + Math.floor(Math.random() * 99);
      db.ref("chat").push({ user: nama, text: chatInput.value });
      chatInput.value = "";
    }
  });
  db.ref("chat").limitToLast(15).on("child_added", (snap) => {
    const msg = snap.val();
    const div = document.createElement("div");
    div.className = "chat-msg";
    div.innerHTML = `<b style="color:var(--neon-cyan)">${msg.user}:</b> ${msg.text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  if (!localStorage.getItem("nama")) {
    const p = prompt("Nama lu siapa nyet?");
    if (p) localStorage.setItem("nama", p);
  }
</script>
</body>
</html>
