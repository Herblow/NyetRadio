<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyetRadio - Live Stream</title>
  <link rel="icon" type="image/png" href="https://files.catbox.moe/rse57p.png">
  <style>
    :root {
      --neon-cyan: #00f2ff;
      --neon-yellow: #facc15;
      --neon-pink: #ff00ff;
      --dark-navy: #020617;
      --card-bg: rgba(30, 41, 59, 0.9);
    }

    body { 
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
      color: white; font-family: 'Inter', sans-serif; 
      text-align: center; margin: 0; display: flex;
      justify-content: center; align-items: center; min-height: 100vh;
    }

    .container { 
      max-width: 450px; width: 90%; background: var(--card-bg); 
      padding: 30px; border-radius: 30px; backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    }

    /* ALBUM ART GG */
    #albumArt {
      width: 200px; height: 200px; border-radius: 20px;
      object-fit: cover; margin: 10px auto 20px;
      display: block; box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
      border: 3px solid var(--neon-cyan);
      transition: all 0.5s ease;
    }

    .radio-title { color: var(--neon-yellow); font-size: 28px; font-weight: 900; margin: 10px 0; text-shadow: 3px 3px 0px #000; }
    
    #nowPlaying { 
      color: var(--neon-cyan); font-weight: bold; font-size: 16px; 
      margin-bottom: 20px; min-height: 24px;
      text-transform: capitalize;
    }

    .player-box { 
      padding: 20px; border-radius: 20px; background: rgba(15, 23, 42, 0.8); 
      border: 1px solid rgba(59, 130, 246, 0.3); 
    }

    audio { width: 100%; filter: invert(100%) brightness(1.5); margin-top: 10px; }

    #chatBox { 
      height: 150px; background: rgba(15, 23, 42, 0.6); text-align: left; 
      padding: 15px; border-radius: 15px; margin: 20px 0 10px;
      font-size: 13px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05);
    }

    #chatInput { 
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; 
      background: #0f172a; color: white; box-sizing: border-box;
    }

    .btn-discord {
      background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
      color: white; border: none; padding: 12px; border-radius: 10px;
      width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px;
      text-decoration: none; display: inline-block;
    }
  </style>
</head>
<body>

<div class="container">
  <img id="albumArt" src="https://files.catbox.moe/rse57p.png" alt="Cover">
  <h1 class="radio-title">NyetRadio</h1>
  
  <div class="player-box">
    <div id="nowPlaying">📡 Menghubungkan...</div>
    <audio id="audioPlayer" controls>
      <source src="https://taxes-housing-indexes-snowboard.trycloudflare.com/live" type="audio/mpeg">
    </audio>
  </div>

  <div id="chatBox"></div>
  <input type="text" id="chatInput" placeholder="Ketik pesan...">
  <a href="https://discord.gg/68hDfgpsFb" target="_blank" class="btn-discord">JOIN DISCORD</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // Konfigurasi Firebase Lu
  const firebaseConfig = {
    apiKey: "AIzaSyDV5K8-zseYUbtzK7QJAkyN-UnILiSFOkg",
    authDomain: "live-chat-nyet.firebaseapp.com",
    databaseURL: "https://live-chat-nyet-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "live-chat-nyet"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const albumArt = document.getElementById('albumArt');
  const nowPlaying = document.getElementById('nowPlaying');

  // FUNGSI MENCARI COVER ALBUM (ARTWORK)
  async function updateArtwork(title, artist) {
    try {
      // Cari di iTunes API
      const query = encodeURIComponent(`${title} ${artist}`);
      const res = await fetch(`https://itunes.apple.com/search?term=${query}&limit=1&entity=song`);
      const data = await res.json();

      if (data.results.length > 0) {
        // Ambil gambar resolusi tinggi
        const imgUrl = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
        albumArt.src = imgUrl;
      } else {
        // Default logo kalau gak ketemu
        albumArt.src = "https://files.catbox.moe/rse57p.png";
      }
    } catch (e) {
      albumArt.src = "https://files.catbox.moe/rse57p.png";
    }
  }

  // LISTEN DATA DARI FIREBASE
  db.ref("nowPlaying").on("value", (snap) => {
    const data = snap.val();
    if (data && data.title && data.title !== 'undefined') {
      nowPlaying.innerHTML = `🎵 ${data.title} <br> <small style="color:var(--neon-yellow)">${data.artist}</small>`;
      updateArtwork(data.title, data.artist);
    } else {
      nowPlaying.innerText = "📡 Station Offline";
      albumArt.src = "https://files.catbox.moe/rse57p.png";
    }
  });

  // CHAT LOGIC (SIMPLE)
  const chatInput = document.getElementById("chatInput");
  const chatBox = document.getElementById("chatBox");

  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && chatInput.value.trim() !== "") {
      let user = localStorage.getItem("nama") || "Nyet-" + Math.floor(Math.random()*99);
      db.ref("chat").push({ user: user, text: chatInput.value });
      chatInput.value = "";
    }
  });

  db.ref("chat").limitToLast(10).on("child_added", (snap) => {
    const msg = snap.val();
    const div = document.createElement("div");
    div.style.marginBottom = "5px";
    div.innerHTML = `<b style="color:var(--neon-cyan)">${msg.user}:</b> ${msg.text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  if(!localStorage.getItem("nama")) {
    const p = prompt("Nama lu siapa bos?");
    if(p) localStorage.setItem("nama", p);
  }
</script>

</body>
</html>
